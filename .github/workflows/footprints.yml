# Draws the contribution grid ("footprints") shown on the profile README.
# Runs twice a day, on every push to main, and on demand from the Actions tab.
# The generated SVGs are published to the `output` branch, which the README reads from.

name: Footprints

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Draw the contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/footprints-dark.svg?palette=github-dark&color_snake=#ffd59a&color_dots=#161b33,#2c3770,#6d5a92,#e9a07a,#ffd59a
            dist/footprints-light.svg?color_snake=#e9824e&color_dots=#ebedf0,#c9cfe8,#9a8cc4,#e9a07a,#e9824e

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
