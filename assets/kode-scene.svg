<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kode: an old monitor running a small program on a desk by a moonlit summer-night window, with butterflies of light rising from the screen.</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0d1330"/>
      <stop offset="0.7"  stop-color="#1c2552"/>
      <stop offset="1"    stop-color="#2d3a6e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b58"/>
      <stop offset="1" stop-color="#0e1430"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8eeff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8eeff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="moon"><circle cx="530" cy="92" r="22"/></clipPath>
    <clipPath id="win"><rect x="110" y="30" width="500" height="262" rx="18"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
    <g id="b">
      <circle r="22" fill="url(#glow)" opacity="0.6"/>
      <path d="M0,0 C-3,-10 -14,-15 -16,-8 C-17,-2 -8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C3,-10 14,-15 16,-8 C17,-2 8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C-6,2 -12,6 -10,10 C-7,13 -2,8 0,0 Z" fill="#ffe0a0"/>
      <path d="M0,0 C6,2 12,6 10,10 C7,13 2,8 0,0 Z" fill="#ffe0a0"/>
    </g>
  </defs>

  <!-- ───── Window onto a summer night ───── -->
  <g filter="url(#sh)">
    <rect x="110" y="30" width="500" height="262" rx="18" fill="url(#night)"/>
  </g>
  <g clip-path="url(#win)">
    <g fill="#ffffff">
      <circle cx="150" cy="70"  r="1.2" opacity="0.7"/>
      <circle cx="210" cy="104" r="0.9" opacity="0.5"/>
      <circle cx="300" cy="60"  r="1.3" opacity="0.7"/>
      <circle cx="372" cy="96"  r="0.9" opacity="0.5"/>
      <circle cx="430" cy="58"  r="1"   opacity="0.6"/>
      <circle cx="590" cy="150" r="1"   opacity="0.5"/>
      <circle cx="250" cy="150" r="0.8" opacity="0.4"/>
    </g>
    <!-- Moon -->
    <circle cx="530" cy="92" r="70" fill="url(#moonglow)"/>
    <circle cx="530" cy="92" r="22" fill="#f1f4ff"/>
    <circle cx="542" cy="86" r="20" fill="#1a2350" opacity="0.2" clip-path="url(#moon)"/>
    <!-- Sea with moon path and far-off lights -->
    <rect x="110" y="250" width="500" height="50" fill="url(#sea)"/>
    <path d="M110,250 C140,238 170,236 196,244 C214,236 236,238 252,250 Z" fill="#141b3d"/>
    <g fill="#ffd59a"><circle cx="176" cy="244" r="1.6"/><circle cx="214" cy="242" r="1.4"/></g>
  </g>
  <rect x="110" y="30" width="500" height="262" rx="18" fill="none" stroke="#d8d2c7" stroke-width="2"/>
  <line x1="360" y1="30" x2="360" y2="200" stroke="#d8d2c7" stroke-width="1.5" opacity="0.3"/>

  <!-- ───── Old monitor on the desk ───── -->
  <circle cx="276" cy="226" r="120" fill="url(#screenglow)"/>
  <g filter="url(#sh)">
    <rect x="166" y="150" width="220" height="168" rx="16" fill="#e9e4da" stroke="#a99f8d" stroke-width="1.4"/>
  </g>
  <rect x="180" y="164" width="192" height="128" rx="8" fill="#0f1530"/>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
    <text x="192" y="186" fill="#8fa3d6">&gt;&gt;&gt;</text>
    <text x="220" y="186" fill="#ffd59a">let</text><text x="244" y="186" fill="#e3e6f3">summer =</text>
    <text x="192" y="202" fill="#f2b866">  "remembered"</text>
    <text x="192" y="222" fill="#8fa3d6">&gt;&gt;&gt;</text>
    <text x="220" y="222" fill="#e3e6f3">print(summer)</text>
    <text x="192" y="240" fill="#aab3d6">remembered</text>
    <text x="192" y="260" fill="#8fa3d6">&gt;&gt;&gt;</text>
  </g>
  <rect x="220" y="250" width="7" height="13" fill="#e3e6f3" opacity="0.85"/>
  <text x="276" y="309" text-anchor="middle" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="11" fill="#6d6a80">Kode</text>
  <circle cx="362" cy="306" r="3" fill="#7fd1a0"/>
  <!-- Stand -->
  <path d="M256,318 L296,318 L304,340 L248,340 Z" fill="#d8d2c7" stroke="#a99f8d" stroke-width="1.2"/>

  <!-- ───── Book stack and mug ───── -->
  <g stroke="#a99f8d" stroke-width="1.2">
    <rect x="440" y="318" width="132" height="22" rx="3" fill="#2c3770"/>
    <rect x="450" y="298" width="114" height="20" rx="3" fill="#6d5a92"/>
    <rect x="444" y="280" width="124" height="18" rx="3" fill="#e9a07a"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <rect x="452" y="327" width="40" height="3" rx="1.5"/>
    <rect x="462" y="306" width="30" height="3" rx="1.5"/>
    <rect x="456" y="287" width="36" height="3" rx="1.5"/>
  </g>
  <!-- Mug with steam -->
  <rect x="520" y="250" width="30" height="30" rx="5" fill="#f3ede1" stroke="#a99f8d" stroke-width="1.2"/>
  <path d="M550,258 C562,258 562,274 550,274" fill="none" stroke="#a99f8d" stroke-width="2.4"/>
  <g fill="none" stroke="#c9c1b2" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M530,244 C526,236 534,230 530,222"/>
    <path d="M540,244 C536,236 544,230 540,222"/>
  </g>

  <!-- ───── Memories rising from the screen ───── -->
  <g fill="none" stroke="#ffe3a6" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.55" filter="url(#blur)">
    <path d="M330,190 C340,164 356,140 378,118"/>
    <path d="M300,180 C296,150 300,120 316,90"/>
    <path d="M350,214 C390,196 420,170 440,140"/>
  </g>
  <use href="#b" transform="translate(380 116) rotate(12) scale(0.85)"/>
  <use href="#b" transform="translate(318 88) rotate(-14) scale(0.7)"/>
  <use href="#b" transform="translate(442 138) rotate(8) scale(0.6)"/>
  <use href="#b" transform="translate(470 74) rotate(-6) scale(0.5)" opacity="0.85"/>

  <!-- Desk -->
  <rect x="96" y="340" width="528" height="10" rx="3" fill="#2c3770" stroke="#d8d2c7" stroke-width="1.2"/>
  <rect x="112" y="350" width="10" height="18" rx="2" fill="#1c2552"/>
  <rect x="598" y="350" width="10" height="18" rx="2" fill="#1c2552"/>
</svg>
