<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A summer-noon postcard: blue sky, tall clouds, a calm sea, a wooden pier, and butterflies. Off the clock: anime, long summers, stories worth keeping.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fd0"/>
      <stop offset="0.7" stop-color="#9cc8f0"/>
      <stop offset="1" stop-color="#d9ecfa"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fbf"/>
      <stop offset="1" stop-color="#1d5a93"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e2a55" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0e2a55" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="360" rx="16"/></clipPath>
    <g id="cloud" fill="#ffffff">
      <circle cx="0" cy="0" r="34"/><circle cx="40" cy="-18" r="44"/><circle cx="90" cy="-4" r="36"/>
      <circle cx="128" cy="10" r="26"/><rect x="-30" y="0" width="180" height="36" rx="18"/>
    </g>
    <g id="b">
      <path d="M0,0 C-3,-10 -14,-15 -16,-8 C-17,-2 -8,1 0,0 Z" fill="#f6b04e"/>
      <path d="M0,0 C3,-10 14,-15 16,-8 C17,-2 8,1 0,0 Z" fill="#f6b04e"/>
      <path d="M0,0 C-6,2 -12,6 -10,10 C-7,13 -2,8 0,0 Z" fill="#e9824e"/>
      <path d="M0,0 C6,2 12,6 10,10 C7,13 2,8 0,0 Z" fill="#e9824e"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="250" fill="url(#sky)"/>

    <!-- Tall summer clouds -->
    <use href="#cloud" transform="translate(760 170) scale(1.5)" opacity="0.95"/>
    <use href="#cloud" transform="translate(1010 120) scale(1.1)" opacity="0.9"/>
    <use href="#cloud" transform="translate(560 200) scale(0.8)" opacity="0.85"/>
    <use href="#cloud" transform="translate(1160 210) scale(0.7)" opacity="0.8"/>

    <!-- Sea -->
    <rect y="250" width="1280" height="110" fill="url(#sea)"/>
    <g fill="#ffffff" opacity="0.35">
      <rect x="640" y="268" width="140" height="2" rx="1"/>
      <rect x="860" y="290" width="90" height="2" rx="1"/>
      <rect x="1020" y="276" width="160" height="2" rx="1"/>
      <rect x="720" y="318" width="110" height="2" rx="1"/>
    </g>

    <!-- Wooden pier reaching into the sea -->
    <g fill="#6b4a32">
      <polygon points="1280,262 1280,280 980,290 980,284"/>
      <rect x="1000" y="288" width="5" height="40"/>
      <rect x="1080" y="285" width="5" height="45"/>
      <rect x="1160" y="282" width="5" height="50"/>
      <rect x="1240" y="279" width="5" height="55"/>
    </g>
    <polygon points="1280,262 1280,265 980,285 980,284" fill="#a27a58"/>

    <!-- Butterflies drifting over the water -->
    <use href="#b" transform="translate(880 262) rotate(-12) scale(1.2)"/>
    <use href="#b" transform="translate(940 236) rotate(14) scale(0.8)"/>
    <use href="#b" transform="translate(820 296) rotate(-6) scale(0.6)"/>

    <rect width="1280" height="360" fill="url(#shade)"/>
  </g>

  <!-- Text -->
  <text x="72" y="96" font-size="12" font-weight="700" letter-spacing="2.4" fill="#e6f1fb">OFF THE CLOCK</text>
  <text x="68" y="152" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="46" font-weight="600" fill="#ffffff">Long summers,</text>
  <text x="68" y="202" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="46" font-weight="600" fill="#ffffff">stories worth keeping.</text>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="16" fill="none" stroke="#9cc8f0" stroke-opacity="0.6"/>
</svg>
