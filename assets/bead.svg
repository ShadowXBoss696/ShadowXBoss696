<svg xmlns="http://www.w3.org/2000/svg" width="80" height="140" viewBox="0 0 80 140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A blue glass bead with a white butterfly inside, hanging on a red cord with a small tassel</title>
  <defs>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0"    stop-color="#bfe8ff"/>
      <stop offset="0.35" stop-color="#4fb3e8"/>
      <stop offset="0.8"  stop-color="#1f6cb8"/>
      <stop offset="1"    stop-color="#174f8f"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cord -->
  <path d="M40,0 C36,12 44,22 40,34" fill="none" stroke="#b8233f" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="36" y="32" width="8" height="6" rx="2" fill="#b8233f"/>

  <!-- Glass bead -->
  <circle cx="40" cy="62" r="24" fill="url(#glass)"/>
  <circle cx="40" cy="62" r="24" fill="none" stroke="#0f3f73" stroke-opacity="0.35"/>

  <!-- White butterfly inside -->
  <g transform="translate(40 63) rotate(-8) scale(0.9)" fill="#ffffff" fill-opacity="0.95">
    <path d="M0,0 C-3,-10 -14,-15 -16,-8 C-17,-2 -8,1 0,0 Z"/>
    <path d="M0,0 C3,-10 14,-15 16,-8 C17,-2 8,1 0,0 Z"/>
    <path d="M0,0 C-6,2 -12,6 -10,10 C-7,13 -2,8 0,0 Z" fill-opacity="0.85"/>
    <path d="M0,0 C6,2 12,6 10,10 C7,13 2,8 0,0 Z" fill-opacity="0.85"/>
  </g>

  <!-- Highlights -->
  <ellipse cx="31" cy="51" rx="8" ry="5" fill="url(#shine)" transform="rotate(-30 31 51)"/>
  <circle cx="51" cy="74" r="2" fill="#ffffff" opacity="0.5"/>

  <!-- Tassel -->
  <rect x="36" y="86" width="8" height="6" rx="2" fill="#b8233f"/>
  <g stroke="#c8325a" stroke-width="2" stroke-linecap="round">
    <path d="M40,92 L40,126"/>
    <path d="M38,92 C36,104 34,114 33,124"/>
    <path d="M42,92 C44,104 46,114 47,124"/>
    <path d="M39,92 C38,106 37,116 36.5,128"/>
    <path d="M41,92 C42,106 43,116 43.5,128"/>
  </g>
</svg>
