<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A polaroid memory of Kode, a programming language interpreter built on the JVM</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c3a"/>
      <stop offset="0.7" stop-color="#2c3770"/>
      <stop offset="1" stop-color="#6d5a92"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <g id="b">
      <path d="M0,0 C-3,-10 -14,-15 -16,-8 C-17,-2 -8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C3,-10 14,-15 16,-8 C17,-2 8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C-6,2 -12,6 -10,10 C-7,13 -2,8 0,0 Z" fill="#ffe0a0"/>
      <path d="M0,0 C6,2 12,6 10,10 C7,13 2,8 0,0 Z" fill="#ffe0a0"/>
    </g>
  </defs>

  <g transform="rotate(-3 360 220)" filter="url(#sh)">
    <!-- Polaroid card -->
    <rect x="150" y="40" width="420" height="360" rx="6" fill="#fbf7ef"/>
    <!-- Photo: a terminal at dusk -->
    <rect x="172" y="62" width="376" height="252" rx="2" fill="url(#dusk)"/>
    <g fill="#fff4d2" opacity="0.5">
      <circle cx="232" cy="80" r="1"/><circle cx="460" cy="74" r="1.2"/><circle cx="520" cy="96" r="1"/>
    </g>
    <!-- Code lines -->
    <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="192" y="118" fill="#8fa3d6">&gt;&gt;&gt;</text>
      <text x="226" y="118" fill="#ffd59a">let</text>
      <text x="254" y="118" fill="#e3e6f3">summer = </text>
      <text x="332" y="118" fill="#f2b866">"remembered"</text>
      <text x="192" y="144" fill="#8fa3d6">&gt;&gt;&gt;</text>
      <text x="226" y="144" fill="#e3e6f3">print(summer)</text>
      <text x="192" y="170" fill="#aab3d6">remembered</text>
      <text x="192" y="196" fill="#8fa3d6">&gt;&gt;&gt;</text>
      <rect x="226" y="185" width="8" height="15" fill="#e3e6f3" opacity="0.8"/>
    </g>
    <!-- Horizon at the bottom of the photo -->
    <rect x="172" y="280" width="376" height="34" fill="#1b2650"/>
    <circle cx="470" cy="281" r="16" fill="#ffd59a" opacity="0.9"/>
    <rect x="172" y="279" width="376" height="2" fill="#e9a07a" opacity="0.6"/>
    <use href="#b" transform="translate(500 210) rotate(-12) scale(0.9)"/>
    <use href="#b" transform="translate(440 238) rotate(10) scale(0.55)" opacity="0.8"/>
    <!-- Caption -->
    <text x="360" y="352" text-anchor="middle" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#2c3770">Kode</text>
    <text x="360" y="378" text-anchor="middle" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#6d6a80">an interpreter on the JVM · a summer past</text>
  </g>
</svg>
