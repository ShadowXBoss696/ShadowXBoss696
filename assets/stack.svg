<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>My tools: Java, the language I think in. Spring Boot, the frame every service hangs on. PostgreSQL, where the memories are kept. Next.js, the front door people walk through. TypeScript, types that keep the story straight.</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2552"/>
      <stop offset="0.75" stop-color="#2c3770"/>
      <stop offset="1" stop-color="#5a4d84"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <g id="b">
      <circle r="18" fill="url(#glow)" opacity="0.6"/>
      <path d="M0,0 C-3,-10 -14,-15 -16,-8 C-17,-2 -8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C3,-10 14,-15 16,-8 C17,-2 8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C-6,2 -12,6 -10,10 C-7,13 -2,8 0,0 Z" fill="#ffe0a0"/>
      <path d="M0,0 C6,2 12,6 10,10 C7,13 2,8 0,0 Z" fill="#ffe0a0"/>
    </g>
  </defs>

  <!-- Java -->
  <g filter="url(#sh)"><rect x="20" y="24" width="232" height="152" rx="16" fill="url(#card)" stroke="#d8d2c7" stroke-opacity="0.5"/></g>
  <rect x="40" y="46" width="28" height="4" rx="2" fill="#ED8B00"/>
  <circle cx="226" cy="48" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="202" cy="64" r="0.9" fill="#ffffff" opacity="0.45"/>
  <text x="40" y="92" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#fff6e6">Java</text>
  <text x="40" y="124" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">the language</text>
  <text x="40" y="145" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">I think in</text>
  <!-- Spring Boot -->
  <g filter="url(#sh)"><rect x="272" y="24" width="232" height="152" rx="16" fill="url(#card)" stroke="#d8d2c7" stroke-opacity="0.5"/></g>
  <rect x="292" y="46" width="28" height="4" rx="2" fill="#6DB33F"/>
  <circle cx="478" cy="48" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="454" cy="64" r="0.9" fill="#ffffff" opacity="0.45"/>
  <text x="292" y="92" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#fff6e6">Spring Boot</text>
  <text x="292" y="124" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">the frame every</text>
  <text x="292" y="145" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">service hangs on</text>
  <!-- PostgreSQL -->
  <g filter="url(#sh)"><rect x="524" y="24" width="232" height="152" rx="16" fill="url(#card)" stroke="#d8d2c7" stroke-opacity="0.5"/></g>
  <rect x="544" y="46" width="28" height="4" rx="2" fill="#4f7fd6"/>
  <circle cx="730" cy="48" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="706" cy="64" r="0.9" fill="#ffffff" opacity="0.45"/>
  <text x="544" y="92" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#fff6e6">PostgreSQL</text>
  <text x="544" y="124" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">where the</text>
  <text x="544" y="145" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">memories are kept</text>
  <!-- Next.js -->
  <g filter="url(#sh)"><rect x="776" y="24" width="232" height="152" rx="16" fill="url(#card)" stroke="#d8d2c7" stroke-opacity="0.5"/></g>
  <rect x="796" y="46" width="28" height="4" rx="2" fill="#d8dbe6"/>
  <circle cx="982" cy="48" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="958" cy="64" r="0.9" fill="#ffffff" opacity="0.45"/>
  <text x="796" y="92" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#fff6e6">Next.js</text>
  <text x="796" y="124" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">the front door</text>
  <text x="796" y="145" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">people walk through</text>
  <!-- TypeScript -->
  <g filter="url(#sh)"><rect x="1028" y="24" width="232" height="152" rx="16" fill="url(#card)" stroke="#d8d2c7" stroke-opacity="0.5"/></g>
  <rect x="1048" y="46" width="28" height="4" rx="2" fill="#4a8fd8"/>
  <circle cx="1234" cy="48" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="1210" cy="64" r="0.9" fill="#ffffff" opacity="0.45"/>
  <text x="1048" y="92" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#fff6e6">TypeScript</text>
  <text x="1048" y="124" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">types that keep</text>
  <text x="1048" y="145" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">the story straight</text>
  <use href="#b" transform="translate(728 34) rotate(14) scale(0.7)"/>
</svg>
