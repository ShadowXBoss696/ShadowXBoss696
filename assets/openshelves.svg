<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>OpenShelves: a library shelf in front of a summer-dusk window. Butterflies of light rise from an open book, under a search bar.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#141c3a"/>
      <stop offset="0.55" stop-color="#2c3770"/>
      <stop offset="0.85" stop-color="#6d5a92"/>
      <stop offset="1"    stop-color="#e9a07a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3f74"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff1d6"/>
      <stop offset="0.35" stop-color="#ffd59a" stop-opacity="0.8"/>
      <stop offset="1"    stop-color="#ffb37a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect x="110" y="44" width="500" height="262" rx="18"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
    <g id="b">
      <circle r="22" fill="url(#glow)" opacity="0.6"/>
      <path d="M0,0 C-3,-10 -14,-15 -16,-8 C-17,-2 -8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C3,-10 14,-15 16,-8 C17,-2 8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C-6,2 -12,6 -10,10 C-7,13 -2,8 0,0 Z" fill="#ffe0a0"/>
      <path d="M0,0 C6,2 12,6 10,10 C7,13 2,8 0,0 Z" fill="#ffe0a0"/>
    </g>
  </defs>

  <!-- ───── Window onto a summer dusk ───── -->
  <g filter="url(#sh)">
    <rect x="110" y="44" width="500" height="262" rx="18" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#win)">
    <g fill="#ffffff">
      <circle cx="170" cy="96"  r="1"   opacity="0.6"/>
      <circle cx="260" cy="80"  r="1.2" opacity="0.5"/>
      <circle cx="560" cy="92"  r="1.2" opacity="0.6"/>
      <circle cx="590" cy="130" r="0.9" opacity="0.4"/>
    </g>
    <g fill="#f3c6b0" opacity="0.2">
      <rect x="150" y="190" width="160" height="5" rx="2.5"/>
      <rect x="470" y="176" width="120" height="4" rx="2"/>
    </g>
    <g transform="translate(0 24)">
    <circle cx="440" cy="252" r="90" fill="url(#sun)"/>
    <circle cx="440" cy="252" r="24" fill="#fff1d6"/>
    <path d="M520,252 C532,236 548,230 560,234 C572,224 592,224 604,238 L612,252 Z" fill="#1a2247"/>
    <rect y="252" x="110" width="500" height="40" fill="url(#sea)"/>
    <g fill="#ffe1b0">
      <rect x="414" y="258" width="52" height="2" rx="1" opacity="0.7"/>
      <rect x="422" y="266" width="36" height="2" rx="1" opacity="0.5"/>
    </g>
    </g>
  </g>
  <!-- Window frame -->
  <rect x="110" y="44" width="500" height="262" rx="18" fill="none" stroke="#d8d2c7" stroke-width="2"/>
  <line x1="360" y1="44" x2="360" y2="200" stroke="#d8d2c7" stroke-width="1.5" opacity="0.35"/>

  <!-- ───── Search bar, floating on the window's top edge ───── -->
  <g filter="url(#sh)">
    <rect x="170" y="22" width="380" height="44" rx="12" fill="#ffffff" stroke="#d8d2c7" stroke-width="1.5"/>
  </g>
  <circle cx="194" cy="44" r="7" fill="none" stroke="#5c6460" stroke-width="2"/>
  <line x1="199" y1="49" x2="204" y2="54" stroke="#5c6460" stroke-width="2" stroke-linecap="round"/>
  <text x="216" y="49" font-size="14" fill="#5c6460">Search the archive, ISBN or author…</text>

  <!-- ───── Shelf in front of the window ───── -->
  <g transform="translate(120 160)" stroke="#d8d2c7" stroke-width="1.2">
    <rect x="0"   y="56"  width="32" height="124" rx="4" fill="#2f5d45"/>
    <rect x="38"  y="30"  width="27" height="150" rx="4" fill="#1e3f2e"/>
    <rect x="71"  y="70"  width="36" height="110" rx="4" fill="#e4eee8"/>
    <rect x="113" y="42"  width="25" height="138" rx="4" fill="#5c6460"/>
    <rect x="144" y="18"  width="34" height="162" rx="4" fill="#2f5d45"/>
    <rect x="184" y="62"  width="29" height="118" rx="4" fill="#d8d2c7"/>
    <rect x="228" y="36"  width="30" height="144" rx="4" fill="#1e3f2e" transform="rotate(11 243 180)"/>
  </g>
  <g transform="translate(120 160)">
    <g fill="#ffffff" fill-opacity="0.6">
      <rect x="8"   y="74" width="16" height="3" rx="1.5"/>
      <rect x="8"   y="82" width="10" height="3" rx="1.5"/>
      <rect x="45"  y="48" width="13" height="3" rx="1.5"/>
      <rect x="152" y="36" width="18" height="3" rx="1.5"/>
      <rect x="152" y="44" width="12" height="3" rx="1.5"/>
      <rect x="119" y="60" width="12" height="3" rx="1.5"/>
    </g>
    <rect x="80" y="90" width="18" height="3" rx="1.5" fill="#2f5d45" fill-opacity="0.55"/>
  </g>

  <!-- Open book, pages glowing, memories rising -->
  <circle cx="470" cy="322" r="44" fill="url(#glow)" opacity="0.4"/>
  <g stroke="#a99f8d" stroke-width="1.4">
    <path d="M410,338 C428,322 452,320 470,330 L470,340 C452,332 430,334 410,346 Z" fill="#ffffff"/>
    <path d="M530,338 C512,322 488,320 470,330 L470,340 C488,332 510,334 530,346 Z" fill="#f3ede1"/>
  </g>
  <g stroke="#c9c1b2" stroke-width="1" opacity="0.8">
    <line x1="424" y1="332" x2="458" y2="327"/>
    <line x1="482" y1="327" x2="516" y2="332"/>
  </g>
  <!-- Butterflies -->
  <g fill="none" stroke="#ffe3a6" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.6" filter="url(#blur)">
    <path d="M470,326 C468,300 480,276 492,256"/>
    <path d="M466,326 C452,296 436,262 428,226"/>
    <path d="M474,326 C496,306 520,262 540,222"/>
  </g>
  <use href="#b" transform="translate(492 254) rotate(12) scale(0.9)"/>
  <use href="#b" transform="translate(428 224) rotate(-16) scale(0.75)"/>
  <use href="#b" transform="translate(540 220) rotate(10) scale(0.6)"/>
  <use href="#b" transform="translate(586 150) rotate(-8) scale(0.55)" opacity="0.85"/>

  <!-- Shelf board -->
  <rect x="96" y="340" width="528" height="10" rx="3" fill="#2f5d45" stroke="#d8d2c7" stroke-width="1.2"/>
  <rect x="112" y="350" width="10" height="18" rx="2" fill="#1e3f2e"/>
  <rect x="598" y="350" width="10" height="18" rx="2" fill="#1e3f2e"/>
</svg>
