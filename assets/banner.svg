<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Arpan Mahanty: backend engineer. Every summer ends; what we build is how we remember it.</title>

  <defs>
    <!-- Summer dusk -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#141c3a"/>
      <stop offset="0.55" stop-color="#2c3770"/>
      <stop offset="0.84" stop-color="#6d5a92"/>
      <stop offset="1"    stop-color="#e9a07a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3f74"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <!-- Darkens the left so the text stays legible -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0e1430" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#0e1430" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff1d6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffd59a" stop-opacity="0.8"/>
      <stop offset="1"   stop-color="#ffb37a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flutter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>

    <!-- One butterfly of light: four soft wings and a glow -->
    <g id="butterfly">
      <circle r="26" fill="url(#flutter)" opacity="0.7"/>
      <path d="M0,0 C-3,-10 -14,-15 -16,-8 C-17,-2 -8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C3,-10 14,-15 16,-8 C17,-2 8,1 0,0 Z" fill="#fff4d2"/>
      <path d="M0,0 C-6,2 -12,6 -10,10 C-7,13 -2,8 0,0 Z" fill="#ffe0a0"/>
      <path d="M0,0 C6,2 12,6 10,10 C7,13 2,8 0,0 Z" fill="#ffe0a0"/>
      <rect x="-0.8" y="-5" width="1.6" height="11" rx="0.8" fill="#fff8e6"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Sky -->
    <rect width="1280" height="240" fill="url(#sky)"/>

    <!-- Faint stars, high up -->
    <g fill="#ffffff">
      <circle cx="640"  cy="34" r="1"   opacity="0.5"/>
      <circle cx="812"  cy="22" r="1.2" opacity="0.6"/>
      <circle cx="1020" cy="40" r="1"   opacity="0.4"/>
      <circle cx="1188" cy="26" r="1.3" opacity="0.6"/>
      <circle cx="905"  cy="64" r="0.9" opacity="0.4"/>
    </g>

    <!-- Thin summer clouds -->
    <g fill="#f3c6b0" opacity="0.18">
      <rect x="700" y="150" width="260" height="6" rx="3"/>
      <rect x="760" y="162" width="180" height="4" rx="2"/>
      <rect x="1060" y="140" width="190" height="5" rx="2.5"/>
    </g>

    <!-- Setting sun -->
    <circle cx="1000" cy="240" r="120" fill="url(#sun)"/>
    <circle cx="1000" cy="240" r="34" fill="#fff1d6"/>

    <!-- Island -->
    <path d="M1090,240 C1110,214 1132,206 1150,212 C1168,196 1196,194 1214,214 C1232,212 1252,224 1268,240 Z" fill="#1a2247"/>
    <rect x="1180" y="196" width="2" height="18" fill="#1a2247"/>
    <circle cx="1181" cy="195" r="2.2" fill="#fff1d6" opacity="0.9"/>

    <!-- Sea -->
    <rect y="240" width="1280" height="80" fill="url(#sea)"/>
    <!-- Sun path on the water -->
    <g fill="#ffe1b0">
      <rect x="966"  y="248" width="68" height="2" rx="1" opacity="0.7"/>
      <rect x="974"  y="258" width="52" height="2" rx="1" opacity="0.55"/>
      <rect x="958"  y="270" width="84" height="2" rx="1" opacity="0.4"/>
      <rect x="980"  y="284" width="40" height="2" rx="1" opacity="0.35"/>
      <rect x="970"  y="298" width="60" height="2" rx="1" opacity="0.25"/>
    </g>
    <g fill="#8fa3d6" opacity="0.18">
      <rect x="620" y="262" width="120" height="1.5" rx="0.75"/>
      <rect x="760" y="290" width="90"  height="1.5" rx="0.75"/>
      <rect x="1120" y="276" width="110" height="1.5" rx="0.75"/>
    </g>

    <!-- Butterflies of light, rising from the sea like memories -->
    <use href="#butterfly" transform="translate(842 206) rotate(-12) scale(0.8)"/>
    <use href="#butterfly" transform="translate(900 150) rotate(10)"/>
    <use href="#butterfly" transform="translate(792 118) rotate(-20) scale(0.7)"/>
    <use href="#butterfly" transform="translate(1068 104) rotate(14) scale(0.9)"/>
    <use href="#butterfly" transform="translate(1146 168) rotate(-8) scale(0.65)"/>
    <use href="#butterfly" transform="translate(964 72) rotate(-6) scale(0.75)"/>
    <use href="#butterfly" transform="translate(720 196) rotate(18) scale(0.55)" opacity="0.8"/>
    <!-- Faint trails -->
    <g fill="none" stroke="#ffe3a6" stroke-width="1" stroke-dasharray="2 6" opacity="0.35" filter="url(#blur)">
      <path d="M860,236 C850,222 846,214 842,206"/>
      <path d="M930,232 C918,200 908,176 900,150"/>
      <path d="M1090,236 C1086,180 1076,140 1068,104"/>
    </g>

    <!-- Legibility shade -->
    <rect width="1280" height="320" fill="url(#shade)"/>
  </g>

  <!-- Text -->
  <text x="72" y="78" font-size="12" font-weight="700" letter-spacing="2.4" fill="#aab3d6">BACKEND ENGINEER · JAVA · SPRING · POSTGRESQL</text>
  <text x="68" y="140" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#fff6e6">Arpan Mahanty</text>
  <text x="72" y="180" font-size="20" fill="#e3e6f3">Building quiet systems that are meant to last.</text>
  <line x1="72" y1="211" x2="104" y2="211" stroke="#ffd59a" stroke-width="1.5"/>
  <text x="116" y="216" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#ffd59a">Every summer ends. What we build is how we remember it.</text>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#2a3360"/>
</svg>
