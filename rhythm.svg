<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>My rhythm: contributions by day of the week over the past year. Most active on Saturdays; 61% on weekends.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c3a"/><stop offset="0.7" stop-color="#2c3770"/><stop offset="1" stop-color="#5a4d84"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8a9e6"/><stop offset="1" stop-color="#6d5a92"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59a"/><stop offset="1" stop-color="#e9a07a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="279" rx="16" fill="url(#sky)" stroke="#2a3360"/>

  <text x="48" y="58" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#fff6e6">My rhythm</text>
  <text x="48" y="82" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#ffd59a">every week has its own tide</text>

  <text x="48" y="150" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#ffd59a">Saturdays</text>
  <text x="48" y="174" font-size="14" fill="#c9cfe8">when I'm most at work</text>
  <line x1="48" y1="196" x2="420" y2="196" stroke="#4a5590" stroke-opacity="0.6"/>
  <text x="48" y="232" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#fff6e6">39% · 61%</text>
  <text x="48" y="254" font-size="13" fill="#c9cfe8">weekdays · weekends</text>

  
